services:
  postgres:
    image: postgres:16-alpine
    container_name: combustiveis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: combustiveis
      POSTGRES_USER: combustiveis
      POSTGRES_PASSWORD: combustiveis
    ports:
      - "5432:5432"
    volumes:
      - combustiveis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U combustiveis -d combustiveis"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  combustiveis_postgres_data:
