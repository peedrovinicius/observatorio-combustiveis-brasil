<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Observatório de Combustíveis Brasil</title>
  <desc id="desc">Fluxo dos dados da ANP até Python, qualidade, modelos dimensionais, PostgreSQL, análises e Power BI.</desc>
